# Runs the five checks required of every iteration — lint, format, typecheck, test, build — on every
# pull request and every push to `main`, plus a sixth that only exists because ambit ships two
# runtimes.
#
# Three decisions worth knowing:
#
#   - AMBIT_SKIP_NETWORK_TESTS is deliberately NOT set. Actions sets CI=true itself, and that is
#     exactly what makes test/dotagents.test.ts mandatory here rather than skippable: the
#     compatibility promise is the guarantee most likely to rot, so it has to be able to
#     fail. A registry blip therefore costs ~70s before it reports. That is the intended trade.
#   - Bun is pinned to an exact version, for the same reason Prettier is: a patch release should not
#     be able to turn this red on its own, and the compiled binaries a release attaches carry
#     whatever Bun built them.
#   - The `node` job is the one thing `bun test` cannot check. The suite runs `src/` under Bun; the
#     npm package is `dist/` under Node, where dependencies resolve by Node's rules, and that is a
#     separate thing that can break. It runs on 20 and 22: 20 is the `engines` floor and 22 is what
#     the scaffolded catalog workflow pins, so both numbers ambit puts its name to are exercised.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to a branch makes the previous run's answer stale; on `main` runs are left alone so
# every commit on the default branch has a recorded verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.3.14"

jobs:
  check:
    name: bun
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # `--frozen-lockfile` installs exactly what bun.lock pins, which is what makes a CI run
      # reproducible in the same sense `ambit install --frozen` is.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Separate from lint because the failure means something different: lint failing is a defect to
      # think about, format failing is `bun run format` and nothing else. Prettier is pinned to an
      # exact version in package.json so that a patch release cannot turn this step red on its own.
      - name: Format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  node:
    name: npm package on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Smoke-test the bundle under Node
        run: bun run scripts/smoke.ts
