# Publishes a release when a version tag is pushed: one binary per platform attached to a GitHub
# Release, and the npm package beside them. Wired and never fired: cutting the first release is an edit to
# `package.json`'s version plus `git tag vX.Y.Z && git push --tags`.
#
# Five decisions worth knowing:
#
#   - **The tag is checked against `package.json`, and a disagreement fails before anything is
#     published.** A tag is the only thing this workflow is given, and `--version` reads
#     `package.json` (`src/version.ts`), so the two must agree or the release would announce one
#     version and install another.
#   - **The five checks run again here** even though `ci.yml` already ran them on `main`. A tag can
#     point at any commit, and publishing bytes nothing verified is the one failure mode that cannot
#     be taken back — npm does not allow republishing a version, and a downloaded binary is gone.
#   - **One runner builds every binary.** `bun build --compile` cross-compiles, so the matrix a
#     release job would otherwise need is a `--target` flag instead. The runner is Linux and it
#     produces the macOS binary too.
#   - **`checksums.txt` is attached and `install.sh` verifies against it.** That script is run
#     through a pipe from the network, so the bytes it installs have to be checkable.
#   - **`--provenance` with `id-token: write`** attests, to the public transparency log, which
#     workflow in which commit built the tarball. This is a public package that runs on other
#     people's machines through `npx`, so the attestation is worth the permission. It requires
#     `repository` in `package.json`, which is why that field is there. **`--access public`** is
#     needed because `@teamnebulab/ambit` is scoped, and npm defaults a scoped package to restricted.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          # Writes the .npmrc that makes NODE_AUTH_TOKEN below the credential for this registry.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag against package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${declared}" >&2
            echo "next: retag, or set the version in package.json and commit it" >&2
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build:binaries

      - name: Smoke-test the bundle under Node
        run: bun run scripts/smoke.ts

      # Only the runner's own platform can be started here. The rest are checked by having been
      # produced at all: `bun build --compile` fails rather than emitting a broken executable.
      - name: Check the binary for this runner starts
        run: |
          chmod +x release/*
          ./release/ambit-linux-x64 --version

      - name: Record the checksums
        working-directory: release
        run: sha256sum ambit-* > checksums.txt

      - name: Attach the binaries to a GitHub Release
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
